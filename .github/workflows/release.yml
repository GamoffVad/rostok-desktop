name: Выпуск

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Установщик и генератор
        shell: pwsh
        run: pwsh build/build-installer.ps1
      - name: Описание выпуска из CHANGELOG
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\].*?(?=^## \[|^\[)")
          "Что изменилось по сравнению с предыдущей версией:`n`n$($m.Value)" | Set-Content notes.md -Encoding utf8
          # генератор без секретного ключа: администратор выбирает файл ключа в самой программе
          Compress-Archive -Path artifacts/Rostok-KeyGen/* -DestinationPath "artifacts/Rostok-KeyGen-$ver.zip"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/Rostok-Setup-*.exe
            artifacts/Rostok-KeyGen-*.zip
